apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: store-prod
resources:
  - ../../base          # reaproveita a base, sem copiar o Deployment
  - pdb.yaml
replicas:
  - name: store-api
    count: 4
images:
  - name: ghcr.io/andhuangg/fiap-store-api
    newTag: "1.0"
patches:
  - path: patch-prod.yaml
