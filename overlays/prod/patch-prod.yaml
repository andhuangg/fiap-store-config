# diferencas de prod: APP_ENV, recursos maiores e grace period de 60 s
apiVersion: apps/v1
kind: Deployment
metadata:
  name: store-api
spec:
  template:
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: store-api
          env:
            - {name: APP_ENV, value: prod}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 256Mi}
