# Configuracao do Argo CD (parte da instalacao, aplicada uma vez junto com o Argo):
# faz o Argo avaliar a SAUDE das Applications filhas. Sem isso, o sync-wave do App-of-Apps
# so espera a Application ser CRIADA, nao ficar Healthy, e as ondas nao seguram a ordem de fato.
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
  labels: {app.kubernetes.io/name: argocd-cm, app.kubernetes.io/part-of: argocd}
data:
  resource.customizations.health.argoproj.io_Application: |
    hs = {}
    hs.status = "Progressing"
    hs.message = ""
    if obj.status ~= nil then
      if obj.status.health ~= nil then
        hs.status = obj.status.health.status
        if obj.status.health.message ~= nil then
          hs.message = obj.status.health.message
        end
      end
    end
    return hs
