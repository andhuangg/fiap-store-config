apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: plataforma-kyverno
  namespace: argocd
  annotations: {argocd.argoproj.io/sync-wave: "-2"}
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: plataforma
  source:
    repoURL: https://kyverno.github.io/kyverno/
    chart: kyverno
    targetRevision: 3.9.2
    helm:
      valuesObject:
        crds:
          migration:
            enabled: false   # Job de migracao de storedVersions (hook post-upgrade sem delete-policy): desnecessario em instalacao nova e deixaria a App OutOfSync
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true, RespectIgnoreDifferences=true]
    # o chart renderiza "labels: {}" e "annotations: {}" vazios nos CRDs policies.kyverno.io; o API server
    # descarta mapas vazios e o Argo veria diferenca eterna (OutOfSync) sem este ignore
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jsonPointers: [/metadata/labels, /metadata/annotations]
